name: PR Deploy CD

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. Gradle 캐시 최적화
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 실행 권한 부여
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 5. Gradle로 빌드 수행
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. 커밋 SHA 기반 JAR 이름 생성
      - name: Generate SHA-based JAR name
        id: generate_tag
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "JAR_NAME=Capstone-BE-$SHORT_SHA.jar" >> $GITHUB_ENV

      # 7. JAR 이름 변경
      - name: Rename JAR with SHA
        run: |
          mv build/libs/Capstone-BE-0.0.1-SNAPSHOT.jar build/libs/${{ env.JAR_NAME }}
          ls -la build/libs/

      # 8. application.yml 생성
      - name: Generate application.yml
        run: |
          echo "${{ secrets.APPLICATION_YML_CONTENT }}" > application.yml
          ls -la application.yml

      # 9. EC2로 파일 전송
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "build/libs/${{ env.JAR_NAME }},application.trip.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          debug: true
          timeout: 60s
          command_timeout: 15m
          strip_components: 1  # build/libs/ 디렉토리 구조 제거

      # 10. EC2에서 파일 전송 확인
      - name: Verify files on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            echo "Checking files in ${{ secrets.DEPLOY_PATH }}..."
            ls -la ${{ secrets.DEPLOY_PATH }}
            if [ -f "${{ secrets.DEPLOY_PATH }}/${{ env.JAR_NAME }}" ] && [ -f "${{ secrets.DEPLOY_PATH }}/application.yml" ]; then
              echo "Files successfully transferred."
            else
              echo "Error: Files not found in ${{ secrets.DEPLOY_PATH }}!"
              exit 1
            fi

      # 11. EC2에서 심볼릭 링크로 jar 교체 및 컨테이너 재시작
      - name: Update symlink and restart Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Current directory: $(pwd)"
            ls -la
            if [ -f "${{ env.JAR_NAME }}" ]; then
              echo "Linking ${{ env.JAR_NAME }} to app.jar..."
              ln -sf ${{ env.JAR_NAME }} app.jar
            else
              echo "Error: ${{ env.JAR_NAME }} not found in ${{ secrets.DEPLOY_PATH }}!"
              exit 1
            fi
            if [ -f "application.yml" ]; then
              echo "application.yml found."
            else
              echo "Error: application.yml not found in ${{ secrets.DEPLOY_PATH }}!"
              exit 1
            fi
            if [ -L "app.jar" ] && [ -f "app.jar" ]; then
              echo "app.jar symlink created and valid."
            else
              echo "Error: app.jar symlink invalid or not created!"
              exit 1
            fi
            echo "Restarting containers..."
            docker-compose down
            docker system prune -f --volumes
            docker-compose up -d --build