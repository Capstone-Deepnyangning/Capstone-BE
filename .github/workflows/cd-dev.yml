name: Dev Deploy CD

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. Gradle 캐시 최적화
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. gradlew 실행 권한 부여
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 5. 고유 태그 생성 (커밋 SHA 앞 7자리)
      - name: Generate Unique Tag
        id: generate_tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # 6. Gradle로 빌드 수행
      - name: Build JAR
        run: ./gradlew clean bootJar -x test

      # 7. 빌드된 JAR 이름 변경
      - name: Rename JAR with tag
        run: |
          TAG=${{ steps.generate_tag.outputs.tag }}
          mv build/libs/Capstone-BE-0.0.1-SNAPSHOT.jar build/libs/app-${TAG}.jar
          ls -la build/libs/

      # 8. application.yml 생성
      - name: Generate application.yml
        run: |
          echo "${{ secrets.APPLICATION_YML_CONTENT }}" > application.yml
          echo "" >> application.yml
          echo "ai:" >> application.yml
          echo "  server-url: ${{ secrets.AI_SERVER_URL }}" >> application.yml
          ls -la application.yml

      # 9. JAR 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "build/libs/app-${{ steps.generate_tag.outputs.tag }}.jar"
          target: "${{ secrets.DEPLOY_PATH }}"
          overwrite: true
          debug: true
          strip_components: 2

      # 10. application.yml 전송
      - name: Copy application.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "application.yml"
          target: "${{ secrets.DEPLOY_PATH }}"
          overwrite: true
          debug: true

      # 11. EC2에서 파일 존재 확인 및 app.jar로 복사
      - name: Prepare files on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Checking uploaded files..."
            ls -la
            TAG=${{ steps.generate_tag.outputs.tag }}
            cp app-${TAG}.jar /home/ubuntu/services/app.jar
            cp application.yml /home/ubuntu/services/application.yml
            echo "Files moved to /home/ubuntu/services"

      # 12. Docker Compose 재시작
      - name: Restart Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/services
            echo "Restarting docker-compose..."
            docker-compose down
            docker system prune -f --volumes
            docker-compose up -d --build