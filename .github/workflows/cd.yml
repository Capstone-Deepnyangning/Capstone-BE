name: PR Deploy CD

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. Gradle 캐시 최적화
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Gradle로 빌드 수행
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. application.yml 파일을 생성하여 EC2에 복사
      - name: Generate application.yml from GitHub Secrets
        run: |
          echo "${{ secrets.APPLICATION_YML_CONTENT }}" > application.yml

      - name: Copy jar file and application.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: |
            build/libs/Capstone-BE-0.0.1-SNAPSHOT.jar
            application.yml
          target: "${{ secrets.DEPLOY_PATH }}"

      # 6. EC2에 SSH 접속해서 컨테이너 재시작
      - name: SSH into EC2 and restart Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Stopping old containers..."
            docker-compose down
            echo "Starting new containers..."
            docker-compose up -d
